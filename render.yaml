services:
  - type: web
    name: ecommerce-pro
    runtime: php
    plan: free
    buildCommand: bash render-build.sh
    startCommand: php -S 0.0.0.0:$PORT -t public

    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        fromContext: env
      - key: APP_KEY
        sync: false # User should set this manually in Render dashboard to persist it
      - key: LOG_CHANNEL
        value: errorlog

      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromService:
          name: ecommerce-db
          type: db
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        fromService:
          name: ecommerce-db
          type: db
          property: database
      - key: DB_USERNAME
        fromService:
          name: ecommerce-db
          type: db
          property: user
      - key: DB_PASSWORD
        fromService:
          name: ecommerce-db
          type: db
          property: password

      # ✅ Use Redis for sessions and cache
      - key: SESSION_DRIVER
        value: redis
      - key: CACHE_DRIVER
        value: redis
      - key: QUEUE_CONNECTION
        value: sync
      - key: REDIS_HOST
        fromService:
          name: ecommerce-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: ecommerce-redis
          type: redis
          property: port
      - key: REDIS_PASSWORD
        value: ""   # empty for free Redis plan
      - key: REDIS_CLIENT
        value: phpredis # Standard for Laravel 11/12 on Render

databases:
  - name: ecommerce-db
    databaseName: ecommerce_pro
    user: ecommerce_user
    plan: free

redis:
  - name: ecommerce-redis
    plan: free